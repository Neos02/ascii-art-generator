<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASCII Art Generator</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <form id="imageForm" class="retro-border retro-shadow">
      <label>
        Kernel Size (Resolution)
        <input id="kernelSize" type="number" value="10" min="1" placeholder="Kernel Size" required />
      </label>
      <label>
        Image
        <input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp" required />
      </label>
      <button type="submit">Generate</button>
    </form>

    <canvas id="imageCanvas"></canvas>

    <div id="asciiContainer"></div>

    <script type="text/javascript" src="./main.js"></script>
  </body>
</html>
