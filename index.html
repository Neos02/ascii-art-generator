<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASCII Art Generator</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <form id="imageForm" class="retro-border retro-shadow">
      <h1>ASCII Art Generator</h1>

      <label>
        Kernel Size (Resolution)
        <input
          id="kernelSize"
          class="retro-border retro-shadow retro-shadow-focus"
          type="number"
          min="1"
          placeholder="10"
          required
        />
      </label>
      <label>
        Image
        <input
          id="imageInput"
          class="retro-border retro-shadow retro-shadow-active"
          type="file"
          accept="image/jpeg,image/png,image/webp"
          required
        />
      </label>
      <button class="retro-border retro-shadow retro-shadow-active" type="submit">Generate</button>
    </form>

    <canvas id="imageCanvas"></canvas>

    <div id="asciiContainer"></div>

    <script type="text/javascript" src="./main.js"></script>
  </body>
</html>
